name: Agent experience research

on:
  workflow_dispatch:
    inputs:
      sheet:
        description: "Path of the contact sheet in the repo (columns: Name, Phone, Email, State)"
        required: true
        default: "sheets/File 1.xlsx"
      mode:
        description: "research = classify the sheet; export_fl = full Florida data downloads; contacts = FL+TX 1+ year contact lists (zip)"
        required: false
        default: "research"

permissions:
  contents: write

jobs:
  research:
    if: ${{ inputs.mode == 'research' || inputs.mode == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SHEET: ${{ inputs.sheet }}
      WORK: /tmp/work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install crawl4ai from this repo
        run: |
          pip install -q -e . pandas openpyxl requests
          python -m playwright install --with-deps chromium || true
          mkdir -p "$WORK"
      - name: Discover Florida bulk files (crawl4ai)
        run: python agent_research/discover_links.py "$WORK/fl_links.json"
      - name: Download Texas licensee data
        run: python agent_research/tx_download.py "$WORK/tx_people.csv"
      - name: Download and filter Florida licenses
        run: python agent_research/fl_extract.py "$WORK/fl_links.json" "$SHEET" "$WORK/fl_matches.csv.gz"
      - name: Classify agents and build workbooks
        run: |
          base=$(basename "$SHEET"); base="${base%.*}"
          mkdir -p sheets/results
          python -W ignore agent_research/combine.py "$SHEET" "$WORK/tx_people.csv" "$WORK/fl_matches.csv.gz" "$WORK/combined.pkl"
          python -W ignore agent_research/write_xlsx.py "$SHEET" "$WORK/combined.pkl" "sheets/results/${base} - with Experience.xlsx"
          python -W ignore agent_research/filter_1plus.py "sheets/results/${base} - with Experience.xlsx" "sheets/results/${base} - 1plus Years.xlsx"
      - name: Commit results (workbooks only, no raw license data)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheets/results
          git commit -m "Experience results for ${SHEET} [skip ci]" || echo "nothing to commit"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}

  export_fl:
    if: ${{ inputs.mode == 'export_fl' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install crawl4ai from this repo
        run: |
          pip install -q -e . openpyxl requests
          python -m playwright install --with-deps chromium || true
      - name: Discover Florida bulk files (crawl4ai)
        run: python agent_research/discover_links.py /tmp/fl_links.json
      - name: Download and convert Florida files
        run: python agent_research/export_fl.py /tmp/fl_links.json /tmp/fl_export
      - name: Upload Excel files
        uses: actions/upload-artifact@v4
        with:
          name: Florida-Licenses-Excel
          path: /tmp/fl_export/*.xlsx
          retention-days: 90
      - name: Upload CSV files
        uses: actions/upload-artifact@v4
        with:
          name: Florida-Licenses-CSV
          path: /tmp/fl_export/*.csv.zip
          retention-days: 90

  contacts:
    if: ${{ inputs.mode == 'contacts' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install crawl4ai from this repo
        run: |
          pip install -q -e . pandas openpyxl requests
          python -m playwright install --with-deps chromium || true
      - name: Discover Florida bulk files (crawl4ai)
        run: python agent_research/discover_links.py /tmp/fl_links.json
      - name: Build FL + TX 1+ year contact lists
        run: python -W ignore agent_research/export_contacts.py /tmp/fl_links.json /tmp/contacts
      - name: Upload Florida part 1
        uses: actions/upload-artifact@v4
        with:
          name: Florida_1plus_Years_With_Phone_part1
          path: /tmp/contacts/FL_part1/
          retention-days: 90
      - name: Upload Florida part 2
        uses: actions/upload-artifact@v4
        with:
          name: Florida_1plus_Years_With_Phone_part2
          path: /tmp/contacts/FL_part2/
          retention-days: 90
      - name: Upload Florida part 3
        uses: actions/upload-artifact@v4
        with:
          name: Florida_1plus_Years_With_Phone_part3
          path: /tmp/contacts/FL_part3/
          retention-days: 90
      - name: Upload Florida part 4
        uses: actions/upload-artifact@v4
        with:
          name: Florida_1plus_Years_With_Phone_part4
          path: /tmp/contacts/FL_part4/
          retention-days: 90
      - name: Upload Texas
        uses: actions/upload-artifact@v4
        with:
          name: Texas_1plus_Years_With_Phone
          path: /tmp/contacts/TX/
          retention-days: 90
